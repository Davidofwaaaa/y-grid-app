<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TOOLS</title>
  <script>
  (function () {
    try {
      if (sessionStorage.getItem("y-grid-open") === "1") {
        document.documentElement.setAttribute("data-open", "1");
      }
    } catch (err) {}
  })();
  </script>
  <style>
@font-face {
  font-family: "IBM Plex Mono";
  src: url("yzy/fonts/IBMPlexMono-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  line-height: 1.35;
}

button, input, a { font: inherit; color: inherit; }

button, a.enter { cursor: pointer; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

#gate, #menu {
  width: 280px;
}

html[data-open] #gate { display: none; }
html:not([data-open]) #menu { display: none; }

.mark {
  margin: 0 0 14px;
  padding-bottom: 6px;
  border-bottom: 1px solid #fff;
}

label { display: block; margin-bottom: 4px; }

input, button, a.enter {
  display: block;
  width: 100%;
  background: transparent;
  border: 1px solid #fff;
  border-radius: 0;
  padding: 3px 6px;
  text-align: left;
  text-decoration: none;
}

#gate-key { margin-bottom: 8px; }
#gate button { margin-bottom: 8px; }

#gate-note, #place {
  min-height: 1.35em;
  margin: 8px 0;
}

#current {
  margin: 0 0 10px;
  font-size: 22px;
  line-height: 1.1;
}

.row {
  display: flex;
  margin-bottom: 8px;
}

.row button {
  width: 50%;
}

.row button + button { margin-left: -1px; }

#list {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
  border-top: 1px solid #fff;
}

#list button {
  border-top: 0;
}

#list button[aria-current="true"] {
  background: #2a2a2a;
}
  </style>
</head>
<body>
  <div id="gate">
    <form id="gate-form" autocomplete="off">
      <p class="mark">TERRAIN</p>
      <label for="gate-key">PASSWORD</label>
      <input id="gate-key" type="password" autocomplete="current-password" spellcheck="false" autofocus>
      <button type="submit">ENTER</button>
      <p id="gate-note" role="status"></p>
    </form>
  </div>
  <div id="menu">
    <p class="mark">TOOLS</p>
    <p id="place"></p>
    <p id="current"></p>
    <p id="note"></p>
    <div class="row">
      <button type="button" id="prev">PREV</button>
      <button type="button" id="next">NEXT</button>
    </div>
    <a class="enter" id="open" href="yzy/">OPEN</a>
    <ul id="list"></ul>
  </div>
  <script>
  (function () {
    var HASH = "d83311e42a584c230a571e0cee22adc65a41f9b93c4b67d79f60d9fd3d017691";
    var TOOLS = [
      { name: "YZY Gemini System", note: "PRESENTATION", href: "presentation/" },
      { name: "YZY Gemini Tool", note: "Y GRID", href: "yzy/" },
      { name: "Rhynova Swiss Cross", note: "GRID", href: "https://davidofwaaaa.github.io/rhynova/" }
    ];
    var index = 0;
    var form = document.getElementById("gate-form");
    var input = document.getElementById("gate-key");
    var gateNote = document.getElementById("gate-note");

    function pad(n) {
      n = String(n);
      return n.length < 2 ? "0" + n : n;
    }

    function show() {
      var tool = TOOLS[index];
      document.getElementById("place").textContent = pad(index + 1) + " / " + pad(TOOLS.length);
      document.getElementById("current").textContent = tool.name;
      document.getElementById("note").textContent = tool.note;
      document.getElementById("open").setAttribute("href", tool.href);
      var list = document.getElementById("list");
      list.innerHTML = "";
      TOOLS.forEach(function (item, i) {
        var li = document.createElement("li");
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = pad(i + 1) + "  " + item.name;
        if (i === index) button.setAttribute("aria-current", "true");
        button.addEventListener("click", function () {
          index = i;
          show();
        });
        li.appendChild(button);
        list.appendChild(li);
      });
    }

    function step(dir) {
      index = (index + dir + TOOLS.length) % TOOLS.length;
      show();
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      crypto.subtle.digest("SHA-256", new TextEncoder().encode(input.value)).then(function (buf) {
        var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return ("0" + b.toString(16)).slice(-2);
        }).join("");
        if (hex !== HASH) {
          gateNote.textContent = "INCORRECT";
          input.value = "";
          input.focus();
          return;
        }
        try { sessionStorage.setItem("y-grid-open", "1"); } catch (err) {}
        document.documentElement.setAttribute("data-open", "1");
        show();
      });
    });

    document.getElementById("prev").addEventListener("click", function () { step(-1); });
    document.getElementById("next").addEventListener("click", function () { step(1); });
    document.addEventListener("keydown", function (event) {
      if (!document.documentElement.hasAttribute("data-open")) return;
      if (event.key === "ArrowLeft") step(-1);
      if (event.key === "ArrowRight") step(1);
      if (event.key === "Enter" && event.target === document.body) {
        window.location.href = TOOLS[index].href;
      }
    });

    if (document.documentElement.getAttribute("data-open") === "1") show();
  })();
  </script>
</body>
</html>
